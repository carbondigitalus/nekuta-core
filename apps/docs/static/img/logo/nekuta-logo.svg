<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Nekutā mango mascot</title>
  <desc id="description">A cheerful golden mango character with a green leaf, large eyes, rosy cheeks, arms, and legs.</desc>
  <defs>
    <linearGradient id="mango" x1="210" y1="230" x2="820" y2="890" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE55C"/>
      <stop offset="0.52" stop-color="#FFC53D"/>
      <stop offset="0.78" stop-color="#FF9638"/>
      <stop offset="1" stop-color="#F4603E"/>
    </linearGradient>
    <linearGradient id="leaf" x1="550" y1="115" x2="855" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68D85E"/>
      <stop offset="0.5" stop-color="#28AF4F"/>
      <stop offset="1" stop-color="#07883E"/>
    </linearGradient>
    <linearGradient id="stem" x1="490" y1="100" x2="555" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A96D35"/>
      <stop offset="1" stop-color="#75451F"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAA110"/>
      <stop offset="1" stop-color="#D98208"/>
    </linearGradient>
  </defs>

  <!-- Stem and leaf sit behind the fruit. -->
  <path d="M501 256C505 209 498 178 479 145C465 121 475 92 498 83C524 73 547 89 558 116C573 154 569 209 554 270Z" fill="url(#stem)"/>
  <path d="M540 159C622 83 746 92 851 174C846 281 790 350 686 391C613 364 565 304 540 159Z" fill="url(#leaf)"/>
  <path d="M568 175C661 186 748 231 826 322" fill="none" stroke="#81DE55" stroke-width="13" stroke-linecap="round" opacity=".75"/>

  <!-- Mango body. -->
  <path d="M499 215C649 195 785 293 829 441C875 596 827 786 696 883C602 952 418 961 297 886C190 819 152 686 190 565C218 474 281 421 315 336C344 265 407 228 499 215Z" fill="url(#mango)"/>

  <!-- Arms. -->
  <path d="M281 659C307 691 333 715 367 737" fill="none" stroke="url(#limb)" stroke-width="25" stroke-linecap="round"/>
  <path d="M750 651C726 686 701 712 669 735" fill="none" stroke="url(#limb)" stroke-width="25" stroke-linecap="round"/>

  <!-- Legs. -->
  <path d="M420 908C418 932 412 953 402 976" fill="none" stroke="url(#limb)" stroke-width="25" stroke-linecap="round"/>
  <path d="M611 914C614 939 620 959 630 980" fill="none" stroke="url(#limb)" stroke-width="25" stroke-linecap="round"/>

  <!-- Cheeks. -->
  <ellipse cx="368" cy="578" rx="46" ry="19" fill="#F197C7" opacity=".9"/>
  <ellipse cx="663" cy="578" rx="46" ry="19" fill="#F197C7" opacity=".9"/>

  <!-- Eyes. -->
  <circle cx="386" cy="520" r="59" fill="#FFFFFF"/>
  <circle cx="386" cy="520" r="38" fill="#050505"/>
  <circle cx="373" cy="506" r="13" fill="#FFFFFF"/>
  <circle cx="644" cy="520" r="59" fill="#FFFFFF"/>
  <circle cx="644" cy="520" r="38" fill="#050505"/>
  <circle cx="631" cy="506" r="13" fill="#FFFFFF"/>

  <!-- Smile. -->
  <path d="M468 581C481 600 497 608 516 608C535 608 552 600 565 581" fill="none" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
</svg>
